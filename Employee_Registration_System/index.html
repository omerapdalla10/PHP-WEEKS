<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #1f3c88;
            margin-top: 0;
        }
        fieldset {
            border: 1px solid #c8d3e6;
            border-radius: 6px;
            margin-bottom: 18px;
            padding: 12px 18px;
        }
        legend {
            font-weight: bold;
            color: #1f3c88;
            padding: 0 6px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #333333;
        }
        .option-label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="text"],
        input[type="number"],
        input[type="file"],
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #b5c1d6;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .buttons {
            text-align: center;
        }
        input[type="submit"],
        input[type="reset"] {
            padding: 10px 25px;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            cursor: pointer;
            font-size: 15px;
            margin: 5px;
        }
        input[type="submit"] {
            background-color: #1f3c88;
        }
        input[type="reset"] {
            background-color: #888888;
        }
        .note {
            font-size: 13px;
            color: #666666;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Registration Form</h2>
    <form action="process.php" method="post" enctype="multipart/form-data">

        <!-- Section 1: Personal information -->
        <fieldset>
            <legend>Employee Information</legend>

            <label for="emp_name">Employee Full Name</label>
            <input type="text" name="emp_name" id="emp_name">

            <label for="emp_id">Employee ID</label>
            <input type="text" name="emp_id" id="emp_id">

            <label>Gender</label>
            <input type="radio" name="gender" value="Male" id="male">
            <label class="option-label" for="male">Male</label>
            <input type="radio" name="gender" value="Female" id="female">
            <label class="option-label" for="female">Female</label>
        </fieldset>

        <!-- Section 2: Job information -->
        <fieldset>
            <legend>Job Information</legend>

            <label for="department">Department</label>
            <select name="department" id="department">
                <option value="">-- Select Department --</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Finance">Finance</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Administration">Administration</option>
            </select>

            <label>Employment Type</label>
            <input type="radio" name="employment_type" value="Full-Time" id="fulltime">
            <label class="option-label" for="fulltime">Full-Time</label>
            <input type="radio" name="employment_type" value="Part-Time" id="parttime">
            <label class="option-label" for="parttime">Part-Time</label>

            <label for="years">Years of Service</label>
            <input type="number" name="years" id="years" step="1">
        </fieldset>

        <!-- Section 3: Salary information -->
        <fieldset>
            <legend>Salary Information ($)</legend>

            <label for="basic_salary">Basic Salary</label>
            <input type="number" name="basic_salary" id="basic_salary" step="0.01">

            <label for="allowance">Allowance</label>
            <input type="number" name="allowance" id="allowance" step="0.01">

            <label for="deduction">Deduction</label>
            <input type="number" name="deduction" id="deduction" step="0.01">
        </fieldset>

        <!-- Section 4: Document upload -->
        <fieldset>
            <legend>Employee Document</legend>

            <label for="document">Upload Document</label>
            <input type="file" name="document" id="document">
            <p class="note">Maximum file size: 2 MB</p>
        </fieldset>

        <!-- Form buttons -->
        <div class="buttons">
            <input type="reset" value="Reset Form">
            <input type="submit" name="submit" value="Submit">
        </div>

    </form>
</div>

</body>
</html>
